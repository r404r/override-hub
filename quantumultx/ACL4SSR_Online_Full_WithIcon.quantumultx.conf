[general]
server_check_url = http://www.gstatic.com/generate_204
server_check_timeout = 5000
# Required: 29 of the 37 remote lists below are published in Clash syntax
# (DOMAIN-SUFFIX,...). The 37 source resources use opt-parser=true for
# conversion on download; the final native geoip resource does not.
resource_parser_url = https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
# Unsupported UDP on a selected node falls back to reject (official setting).
fallback_udp_policy = reject
excluded_routes = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 239.255.255.250/32, 255.255.255.255/32
icmp_auto_reply = true
dns_exclusion_list = *.lan, *.local, *.home.arpa, *.in-addr.arpa, *.ip6.arpa, captive.apple.com, time.*.com, ntp.*.com, *.cloudflareclient.com, *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me

[dns]
# QX-only DNS settings retained unchanged; the source override has no dns key.
no-ipv6
# AAAA queries fail with no-ipv6; resolver and network behaviour need device tests.
no-system
doh-server = https://223.5.5.5/dns-query, https://120.53.53.53/dns-query

