; 塔台（Tower）规则方案：以塔台内置“ACL4SSR 全分组”（ACL4SSR_Online_Full.ini @75f0101）为底，
; 只插入并追加 ACL4SSR_Online_Full_WithIcon.yaml 中的专属分组与规则（pure、AI、共享服务、Google、GitHub、日韩台自动）；
; 内置规则与分组不改动，仅在 4 个选择组末尾追加可选项。
[custom]
;不要随意改变关键字，否则会导致出错
;acl4SSR规则

;去广告：支持
;自动测速：支持
;微软分流：支持
;苹果分流：支持
;增强中国IP段：支持
;增强国外GFW：支持

